fragment authorfields on Author {
  id
  name
}

query messages($tab: String!) {
  messages(tab: $tab) {
    __typename
    id
    type
    active
    numberOfComments
    cost
    authors {
      __typename
      ...authorfields
    }
    date
    replyTo {
      id
      type
      authors {
        ...authorfields
      }
    }
  }
}
