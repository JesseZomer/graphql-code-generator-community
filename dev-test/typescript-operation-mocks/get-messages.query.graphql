query messages($tab: String!) {
  messages(tab: $tab) {
    __typename
    id
    type
    active
    numberOfComments
    cost
    comments
    authors {
      __typename
      ...authorfields
    }
    date
    replyTo {
      id
      type
      authors {
        ...authorfields
      }
    }
    food {
      ...foodfields
    }
  }
}
